name: test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # E2E tests (test/e2e.test.js) need a real browser; installs Chromium + its OS deps.
      - run: npx playwright install --with-deps chromium
      - run: npm test
